[tool.pytest.ini_options]
# Only collect the real unit tests under tests/.
# The repo root contains ad-hoc helper scripts (beyin_test.py, test_firewall.py,
# test_sniffer.py) that execute network/Ollama code at import time and must not
# be treated as pytest test modules.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
