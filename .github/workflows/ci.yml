name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Mypy (modules)
        run: mypy modules/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pywin32 is Windows-only (guarded by an environment marker) and is
          # skipped on the Linux runner.
          pip install -r requirements-dev.txt

      - name: Run tests
        # Coverage includes the core watcher and config — the largest,
        # most security-relevant files must not be invisible to the report.
        # The floor stops coverage from silently regressing (currently ~62%).
        run: >
          pytest --cov=modules --cov=db_manager --cov=log_watcher --cov=config
          --cov-report=term-missing --cov-fail-under=55

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: Bandit (SAST, fails on medium+ severity)
        run: bandit -r modules/ ui/ db_manager.py log_watcher.py config.py dashboard.py --severity-level medium
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt
